services:
  - type: web
    name: nagarnetra
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CLOUDINARY_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: MODEL_PATH
        value: models/pothole.onnx
